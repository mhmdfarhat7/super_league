<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Champions themed background">
  <defs>
    <radialGradient id="g1" cx="0" cy="0" r="1">
      <stop offset="0%" stop-color="#0a1034"/>
      <stop offset="100%" stop-color="#0e1148"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <g id="star">
      <polygon points="10,0 12.6,7 20,7.3 14.3,12 16,19 10,15 4,19 5.7,12 0,7.3 7.4,7" fill="#dbeafe"/>
    </g>
  </defs>
  <rect width="100%" height="100%" fill="url(#g1)"/>
  <!-- soft glows -->
  <circle cx="280" cy="140" r="260" fill="url(#glow)"/>
  <circle cx="1420" cy="160" r="280" fill="url(#glow2)"/>
  <circle cx="900" cy="680" r="360" fill="url(#glow)"/>
  <!-- scattered stars -->
  <g opacity="0.6">
    <use href="#star" x="200" y="120"/>
    <use href="#star" x="480" y="200"/>
    <use href="#star" x="820" y="160"/>
    <use href="#star" x="1100" y="100"/>
    <use href="#star" x="1320" y="240"/>
    <use href="#star" x="220" y="480"/>
    <use href="#star" x="520" y="560"/>
    <use href="#star" x="760" y="460"/>
    <use href="#star" x="1200" y="520"/>
    <use href="#star" x="1400" y="720"/>
  </g>
  <!-- subtle streaks -->
  <g opacity="0.25" filter="url(#blur)" stroke="#7c3aed" stroke-width="2">
    <path d="M50 820 C 400 700, 900 1020, 1600 760" fill="none"/>
    <path d="M-100 580 C 300 500, 1100 760, 1700 560" fill="none"/>
  </g>
</svg>

