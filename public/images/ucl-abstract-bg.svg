<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="UCL inspired abstract background">
  <defs>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1034"/>
      <stop offset="100%" stop-color="#0e1148"/>
    </linearGradient>
    <linearGradient id="ribbon1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <pattern id="mesh" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20H40 M20 0V40" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#indigo)"/>
  <rect width="100%" height="100%" fill="url(#mesh)"/>

  <!-- soft spotlight glows -->
  <ellipse cx="250" cy="120" rx="420" ry="220" fill="url(#glow)" filter="url(#blur)"/>
  <ellipse cx="1350" cy="220" rx="500" ry="260" fill="url(#glow2)" filter="url(#blur)"/>
  <ellipse cx="900" cy="780" rx="520" ry="260" fill="url(#glow)" filter="url(#blur)"/>

  <!-- diagonal ribbons reminiscent of UCL visuals -->
  <g opacity="0.9">
    <path d="M-100 560 C 220 520, 460 640, 760 600 S 1280 540, 1700 640 L 1700 740 L -100 740 Z" fill="url(#ribbon1)" opacity="0.25"/>
    <path d="M-100 640 C 240 700, 640 660, 960 720 S 1360 760, 1700 700 L 1700 900 L -100 900 Z" fill="url(#ribbon2)" opacity="0.35"/>
  </g>

  <!-- subtle vignette -->
  <rect width="100%" height="100%" fill="black" opacity="0.18"/>
</svg>

