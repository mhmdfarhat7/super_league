<section class="home">

  <div class="buttons">
    <button type="button" class="btn primary" appUiSound (click)="onStartGame()">Start Game</button>
    <button type="button" class="btn options" appUiSound (click)="onOptions()">Options</button>
    <button type="button" class="btn danger" appUiSound (click)="onExitGame()">Exit Game</button>
  </div>
</section>

<div class="intro-overlay" *ngIf="showIntro" #introContainer>
  <video #introVideo class="intro-video" preload="auto" playsinline (ended)="onIntroEnded()">
    <source src="/clips/UEAF Champions League Intro.mp4" type="video/mp4">
  </video>
  <button type="button" class="skip-btn" (click)="skipIntro()">Skip</button>
</div>
