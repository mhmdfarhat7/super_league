<div class="neon-background"></div>
<section class="options neo neon-page-content" aria-label="Game Options">
  <div class="options-panel neon-card">
    <header class="panel-header">
      <div class="title">
        <h2>Settings</h2>
        <p class="muted">Audio · Experience</p>
        <span class="status" [class.active]="!bgMuted()">
          <span class="dot"></span>
          {{ bgMuted() ? 'Muted' : 'Playing' }}
        </span>
      </div>

      <button class="icon-toggle" [class.active]="!bgMuted()" appUiSound (click)="toggleBgAudio()" [attr.aria-pressed]="!bgMuted()" aria-label="Toggle Anthem">
        <img class="icon-lg" [src]="bgMuted() ? '/images/SoundOff.jpg' : '/images/SoundOn.jpg'" [alt]="bgMuted() ? 'Sound Off' : 'Sound On'">
      </button>
    </header>

    <div class="panel-body">
      <div class="card audio">
        <div class="row">
          <label for="bgVol">Anthem Volume</label>
          <span class="value-chip">{{ bgVol() }}%</span>
        </div>
        <div class="meter-wrap" aria-hidden="true">
          <div class="meter-track">
            <div class="meter-fill" [style.width.%]="bgVol()"></div>
          </div>
          <input id="bgVol" class="meter-input" type="range" min="0" max="100" [value]="bgVol()"
                 (input)="onBgVol(($any($event.target).valueAsNumber || +$any($event.target).value))">
        </div>
      </div>

      <div class="card audio">
        <div class="row">
          <label for="sfxVol">Effects Volume</label>
          <span class="value-chip">{{ sfxVol() }}%</span>
        </div>
        <div class="meter-wrap" aria-hidden="true">
          <div class="meter-track">
            <div class="meter-fill" [style.width.%]="sfxVol()"></div>
          </div>
          <input id="sfxVol" class="meter-input" type="range" min="0" max="100" [value]="sfxVol()"
                 (input)="onSfxVol(($any($event.target).valueAsNumber || +$any($event.target).value))">
        </div>
      </div>
    </div>

    <footer class="panel-footer">
      <a class="btn link" appUiSound (click)="goBack()">Back</a>
    </footer>
  </div>
</section>
